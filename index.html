<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Pedalboard Configs</title>
  <!-- ?v=N is a manual cache-buster against GitHub Pages' CDN (~10min
       default max-age) -- bump it whenever style.css or app.js changes
       and you need visitors to pick it up immediately rather than wait
       out the CDN's own cache. config.dot/config.json don't need this:
       they're fetched at runtime with cache:'no-cache' instead (see
       app.js's main()), so editing either never requires remembering to
       bump anything here. -->
  <link rel="stylesheet" href="style.css?v=15" />
  <script>
    // Sets the theme attribute style.css's :root[data-theme] rules key
    // off (see app.js's initTheme for the rest of the toggle) before the
    // stylesheet ever paints anything -- run any later, e.g. from
    // app.js's own script tag at the end of body, and a visitor who
    // picked "dark" would see one frame of the light theme flash by on
    // every load first. No stored choice yet means no attribute at all,
    // same as before this toggle existed -- prefers-color-scheme alone
    // still decides.
    try {
      const saved = localStorage.getItem('theme');
      if (saved === 'light' || saved === 'dark') document.documentElement.dataset.theme = saved;
    } catch {}
  </script>
</head>
<body>
  <header>
    <h1>My Gear</h1>
    <!-- Grouped so header's own flex row (see style.css) only ever has
         two items to place -- the title and this whole cluster -- rather
         than needing to push each control right individually. -->
    <div class="header-controls">
      <!-- A plain link, not a checkbox/button like the controls beside it
           -- it holds no state of its own, just opens the repo in a new
           tab. target="_blank" is why rel="noopener noreferrer" is here:
           without it the new tab gets a `window.opener` back to this page. -->
      <a class="github-link" href="https://github.com/cthiebaud/gear" target="_blank" rel="noopener noreferrer" title="View source on GitHub">
        <svg viewBox="0 0 98 96" width="22" height="22">
          <path d="M41.4395 69.3848C28.8066 67.8535 19.9062 58.7617 19.9062 46.9902C19.9062 42.2051 21.6289 37.0371 24.5 33.5918C23.2559 30.4336 23.4473 23.7344 24.8828 20.959C28.7109 20.4805 33.8789 22.4902 36.9414 25.2656C40.5781 24.1172 44.4062 23.543 49.0957 23.543C53.7852 23.543 57.6133 24.1172 61.0586 25.1699C64.0254 22.4902 69.2891 20.4805 73.1172 20.959C74.457 23.543 74.6484 30.2422 73.4043 33.4961C76.4668 37.1328 78.0937 42.0137 78.0937 46.9902C78.0937 58.7617 69.1934 67.6621 56.3691 69.2891C59.623 71.3945 61.8242 75.9883 61.8242 81.252L61.8242 91.2051C61.8242 94.0762 64.2168 95.7031 67.0879 94.5547C84.4102 87.9512 98 70.6289 98 49.1914C98 22.1074 75.9883 6.69539e-07 48.9043 4.309e-07C21.8203 1.92261e-07 -1.9479e-07 22.1074 -4.3343e-07 49.1914C-6.20631e-07 70.4375 13.4941 88.0469 31.6777 94.6504C34.2617 95.6074 36.75 93.8848 36.75 91.3008L36.75 83.6445C35.4102 84.2188 33.6875 84.6016 32.1562 84.6016C25.8398 84.6016 22.1074 81.1563 19.4277 74.7441C18.375 72.1602 17.2266 70.6289 15.0254 70.3418C13.877 70.2461 13.4941 69.7676 13.4941 69.1934C13.4941 68.0449 15.4082 67.1836 17.3223 67.1836C20.0977 67.1836 22.4902 68.9063 24.9785 72.4473C26.8926 75.2227 28.9023 76.4668 31.2949 76.4668C33.6875 76.4668 35.2187 75.6055 37.4199 73.4043C39.0469 71.7773 40.291 70.3418 41.4395 69.3848Z" />
        </svg>
      </a>
      <!-- Pure CSS: the checkbox's :checked state is read by style.css via
           body:has(#power-connectors-toggle:not(:checked)) to hide the power
           wires/bolt markers, and by the sibling combinator below to swap the
           icon for its struck-through state. app.js's routing never sees this
           -- it always lays out power connectors as present; this only ever
           toggles their painted visibility. -->
      <label class="power-toggle" title="Show/hide power-supply connectors">
        <input type="checkbox" id="power-connectors-toggle" checked hidden />
        <svg viewBox="0 0 46.093 46.093" width="27" height="27">
          <path d="M34.137 20.862c-.475-.761-1.307-1.232-2.204-1.232h-6.356l6.707-16.032c.335-.802.248-1.717-.234-2.44C31.567.435 30.757 0 29.888 0h-8.444c-1.15 0-2.163.761-2.49 1.863l-7.283 24.565c-.233.786-.082 1.627.409 2.284.49.657 1.261 1.035 2.081 1.035h6.807l-1.189 14.106c-.083.987.548 1.898 1.503 2.164.955.264 1.962-.187 2.399-1.076l10.582-21.56c.396-.803.347-1.758-.126-2.519" />
          <line class="power-toggle-slash" x1="3" y1="3" x2="43" y2="43" />
        </svg>
      </label>
      <!-- :checked here means "dark" -- app.js's initTheme sets this once
           on load to whatever theme actually resolved (an explicit stored
           choice, or prefers-color-scheme if there isn't one yet) and
           toggles both the checkbox and :root[data-theme] together from
           then on, so this always matches what's actually painted. -->
      <label class="theme-toggle" title="Toggle light/dark theme">
        <input type="checkbox" id="theme-toggle" hidden />
        <svg viewBox="0 0 24 24" width="25" height="25">
          <g class="theme-toggle-sun">
            <circle cx="12" cy="12" r="4.5" />
            <line x1="12" y1="1" x2="12" y2="3.5" />
            <line x1="12" y1="20.5" x2="12" y2="23" />
            <line x1="1" y1="12" x2="3.5" y2="12" />
            <line x1="20.5" y1="12" x2="23" y2="12" />
            <line x1="4.4" y1="4.4" x2="6.1" y2="6.1" />
            <line x1="17.9" y1="17.9" x2="19.6" y2="19.6" />
            <line x1="4.4" y1="19.6" x2="6.1" y2="17.9" />
            <line x1="17.9" y1="6.1" x2="19.6" y2="4.4" />
          </g>
          <path class="theme-toggle-moon" d="M20.742 15.723A8.5 8.5 0 1 1 9.777 4.223 6.5 6.5 0 0 0 20.742 15.723Z" />
        </svg>
      </label>
      <!-- A real <button>, not another checkbox like the two labels above
           -- this doesn't hold a setting of its own, it just fires the
           same toggleCascade() the spacebar and the guitar's own click
           already do (see app.js's initCascadeToggle and main()'s keydown
           listener), and its look is kept in sync with cascadeActive by
           setCascadeActive regardless of which of those three actually
           changed it. aria-pressed (kept current the same way) is what a
           screen reader announces here instead of the icon swap. -->
      <button type="button" class="cascade-toggle" id="cascade-toggle" title="Play the signal-path animation" aria-pressed="false">
        <svg viewBox="0 0 24 24" width="25" height="25">
          <path class="cascade-toggle-play" d="M7 4.5 19.5 12 7 19.5Z" />
          <rect class="cascade-toggle-stop" x="5.5" y="5.5" width="13" height="13" rx="2" />
        </svg>
      </button>
    </div>
  </header>
  <main id="app">
    <!-- Static markup, not JS-built like everything else in #app -- shows
         immediately on first paint, before app.js has even finished
         fetching config.dot/images/the libavoid WASM module, let alone
         solving a layout. app.js removes it once the diagram is fully
         routed (see main()); nothing here needs a JS fallback for that
         not happening, since main() removes it in a `finally`. -->
    <div class="loading" id="loading">
      <svg class="spinner" viewBox="0 0 50 50" width="48" height="48" aria-hidden="true">
        <circle class="spinner-track" cx="25" cy="25" r="20" fill="none" stroke-width="4" />
        <circle class="spinner-arc" cx="25" cy="25" r="20" fill="none" stroke-width="4" />
      </svg>
      <p>Loading…</p>
    </div>
  </main>
  <script src="libs/dotparser/dotparser.min.js"></script>
  <script src="app.js?v=29"></script>
</body>
</html>
